
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile-and-smoke:
    name: compile + run examples
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile all Python files
        run: python -m compileall examples

      - name: Run example experiments (smoke test)
        run: |
          python examples/01_covariance_and_mvdr.py
          python examples/02_psd_estimation.py
          python examples/03_regularized_sensor_fusion.py
          python examples/04_domain_shift_evaluation.py
          python examples/05_low_rank_denoising.py
